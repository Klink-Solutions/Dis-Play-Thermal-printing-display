<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editable Weather Receipt Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <p class="eyebrow">Weather receipt</p>
        <h1>Preview settings</h1>
        <p class="help-text">The preview shows sample weather values. The clock and date use your browser’s local time.</p>

        <div class="field">
          <label for="cityName">Location</label>
          <input id="cityName" type="text" value="Bad Wörishofen" />
        </div>

        <div class="field">
          <label for="weatherPreview">Current weather</label>
          <select id="weatherPreview">
            <option value="Clear">Clear</option>
            <option value="Partly Cloudy">Partly cloudy</option>
            <option value="Clouds">Cloudy</option>
            <option value="Rain">Rain</option>
            <option value="Snow">Snow</option>
            <option value="Thunderstorm">Thunderstorm</option>
            <option value="Mist">Mist / fog</option>
          </select>
        </div>

        <div class="field">
          <label for="temperature">Temperature (°C)</label>
          <input id="temperature" type="number" step="0.1" value="18.6" />
        </div>

        <div class="field">
          <label for="highTemperature">Today's high (°C)</label>
          <input id="highTemperature" type="number" step="0.1" value="21.4" />
        </div>

        <div class="field">
          <label for="lowTemperature">Today's low (°C)</label>
          <input id="lowTemperature" type="number" step="0.1" value="14.2" />
        </div>

        <div class="field">
          <label for="feelsLike">Feels like (°C)</label>
          <input id="feelsLike" type="number" step="0.1" value="17.8" />
        </div>

        <div class="row">
          <div class="field">
            <label for="rainChance">Rain (%)</label>
            <input id="rainChance" type="number" min="0" max="100" value="20" />
          </div>
          <div class="field">
            <label for="humidity">Humidity (%)</label>
            <input id="humidity" type="number" min="0" max="100" value="61" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="windSpeed">Wind (km/h)</label>
            <input id="windSpeed" type="number" min="0" step="0.1" value="12.4" />
          </div>
          <div class="field">
            <label for="windDirection">Wind direction</label>
            <select id="windDirection">
              <option>N</option><option>NE</option><option>E</option><option>SE</option>
              <option selected>S</option><option>SW</option><option>W</option><option>NW</option>
            </select>
          </div>
        </div>

        <button id="exportButton" type="button">Export receipt PNG</button>
      </aside>

      <main class="preview-panel">
        <div class="preview-toolbar">
          <div>
            <p class="eyebrow">48 mm printable width</p>
            <h2>Receipt preview</h2>
          </div>
          <span class="sample-badge">Sample weather</span>
        </div>
        <div class="receipt-stage">
          <article id="receiptPreview" class="receipt" aria-live="polite"></article>
        </div>
      </main>
    </div>
    <script src="weather-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
